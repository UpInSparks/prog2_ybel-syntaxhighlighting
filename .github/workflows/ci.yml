name: Github CI
on:
    pull_request:
    workflow_dispatch:

jobs:
    # gradle test
    build:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-java@v5
                with:
                    java-version: '25'
                    distribution: 'temurin'
            -   uses: gradle/actions/wrapper-validation@v6
            -   run: ./gradlew build

    test:
        needs: build
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-java@v5
                with:
                    java-version: '25'
                    distribution: 'temurin'
            -   uses: gradle/actions/wrapper-validation@v6
            -   run: ./gradlew test

    format:
        needs: test
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v6
            -   uses: actions/setup-java@v5
                with:
                    java-version: '25'
                    distribution: 'temurin'
            -   uses: gradle/actions/wrapper-validation@v6
            -   run: ./gradlew spotlessCheck
